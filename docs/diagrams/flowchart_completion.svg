<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:2355px;height:888px;background:#FFFFFF;" width="2355px" height="888px" viewBox="0 0 2355 888" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="879.457" y="33.563" fill="#000" font-size="14" textLength="594.795" font-weight="700">Блок-схема 4.3. Обработка события ORDER_COMPLETED (завершение исполнения)</text><text x="1058.494" y="50.502" fill="#000" font-size="14" textLength="236.722" font-weight="700">выбор ордера из буфера — Д2Б4</text></g><rect x="20" y="71.515" width="2308.709" height="15.729" fill="none" style="stroke:none;"/><ellipse cx="194.396" cy="102.244" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="132.244" width="336.792" height="35.729" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="154.838" fill="#000" font-size="13" textLength="316.792">Событие ORDER_COMPLETED: движок j, момент t</text><rect x="35.506" y="187.974" width="317.781" height="67.188" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="45.506" y="210.567" fill="#000" font-size="13" textLength="213.446">t_кон := t, T_обсл := t_кон − t_нач,</text><text x="45.506" y="226.297" fill="#000" font-size="13" textLength="297.781">T_преб := t_кон − t_пост, освободить движок j,</text><text x="45.506" y="242.026" fill="#000" font-size="13" textLength="228.052">накопить время занятости движка j</text><rect x="202.848" y="668.998" width="381.258" height="67.188" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="212.848" y="691.592" fill="#000" font-size="13" textLength="289.275">Занять движок j: t_нач := t, T_ож := t − t_пост,</text><text x="212.848" y="707.321" fill="#000" font-size="13" textLength="182.584">разыграть T_обсл ~ Exp(μ_j),</text><text x="212.848" y="723.051" fill="#000" font-size="13" textLength="361.258">запланировать ORDER_COMPLETED в момент t + T_обсл</text><line x1="20" y1="71.515" x2="20" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><rect x="594.106" y="275.162" width="374.885" height="51.459" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="604.106" y="297.756" fill="#000" font-size="13" textLength="241.021">Записать результат: ордер исполнен,</text><text x="604.106" y="313.485" fill="#000" font-size="13" textLength="354.885">добавить T_ож, T_обсл, T_преб в статистику источника</text><line x1="588.106" y1="71.515" x2="588.106" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><polygon points="1266.607,346.621,1345.553,346.621,1357.553,358.621,1345.553,370.621,1266.607,370.621,1254.607,358.621,1266.607,346.621" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1266.607" y="363.35" fill="#000" font-size="13" textLength="78.946">Буфер пуст?</text><text x="1239.145" y="355.485" fill="#000" font-size="13" textLength="15.463">да</text><text x="1357.553" y="355.485" fill="#000" font-size="13" textLength="21.322">нет</text><rect x="978.99" y="390.621" width="256.019" height="51.459" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="988.99" y="413.215" fill="#000" font-size="13" textLength="141.661">Движок j простаивает</text><text x="988.99" y="428.944" fill="#000" font-size="13" textLength="236.019">до следующего поступления ордера</text><rect x="1357.391" y="390.621" width="295.539" height="51.459" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1367.391" y="413.215" fill="#000" font-size="13" textLength="251.374">Среди ордеров в буфере найти ордера</text><text x="1367.391" y="428.944" fill="#000" font-size="13" textLength="275.539">с наименьшим номером источника (Д2Б4)</text><polygon points="1418.566,462.08,1591.756,462.08,1603.756,474.08,1591.756,486.08,1418.566,486.08,1406.566,474.08,1418.566,462.08" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1418.566" y="478.809" fill="#000" font-size="13" textLength="173.189">Таких ордеров несколько?</text><text x="1391.103" y="470.944" fill="#000" font-size="13" textLength="15.463">да</text><text x="1603.756" y="470.944" fill="#000" font-size="13" textLength="21.322">нет</text><rect x="1265.009" y="496.08" width="235.776" height="51.459" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1275.009" y="518.674" fill="#000" font-size="13" textLength="215.776">Выбрать последний поступивший</text><text x="1275.009" y="534.403" fill="#000" font-size="13" textLength="146.821">(максимальное t_пост)</text><rect x="1520.785" y="496.08" width="213.28" height="35.729" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1530.785" y="518.674" fill="#000" font-size="13" textLength="193.28">Выбрать единственный ордер</text><polygon points="1505.161,553.539,1517.161,565.539,1505.161,577.539,1493.161,565.539,1505.161,553.539" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="1306.08,746.187,1318.08,758.187,1306.08,770.187,1294.08,758.187,1306.08,746.187" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="972.99" y1="71.515" x2="972.99" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><rect x="1744.065" y="597.539" width="351.525" height="51.459" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1754.065" y="620.133" fill="#000" font-size="13" textLength="331.525">Извлечь выбранный ордер, освободить его ячейку,</text><text x="1754.065" y="635.862" fill="#000" font-size="13" textLength="291.218">остальные ордера остаются на своих местах</text><line x1="1738.065" y1="71.515" x2="1738.065" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><rect x="2105.59" y="790.187" width="218.58" height="35.729" fill="#F7F9FC" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="2115.59" y="812.78" fill="#000" font-size="13" textLength="198.58">Вернуться в главный цикл (4.1)</text><ellipse cx="2214.88" cy="856.916" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="2214.88" cy="856.916" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="2099.59" y1="71.515" x2="2099.59" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><line x1="2328.17" y1="71.515" x2="2328.17" y2="867.916" style="stroke:#000;stroke-width:1.5;"/><line x1="194.396" y1="112.244" x2="194.396" y2="132.244" style="stroke:#333;stroke-width:1;"/><polygon points="190.396,122.244,194.396,132.244,198.396,122.244,194.396,126.244" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="194.396" y1="167.974" x2="194.396" y2="187.974" style="stroke:#333;stroke-width:1;"/><polygon points="190.396,177.974,194.396,187.974,198.396,177.974,194.396,181.974" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1406.566" y1="474.08" x2="1382.897" y2="474.08" style="stroke:#333;stroke-width:1;"/><line x1="1382.897" y1="474.08" x2="1382.897" y2="496.08" style="stroke:#333;stroke-width:1;"/><polygon points="1378.897,486.08,1382.897,496.08,1386.897,486.08,1382.897,490.08" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1603.756" y1="474.08" x2="1627.425" y2="474.08" style="stroke:#333;stroke-width:1;"/><line x1="1627.425" y1="474.08" x2="1627.425" y2="496.08" style="stroke:#333;stroke-width:1;"/><polygon points="1623.425,486.08,1627.425,496.08,1631.425,486.08,1627.425,490.08" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stro